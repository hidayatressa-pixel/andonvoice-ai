name: Apply Operator Notification Icon UI Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-operator-icon-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch active-call icon only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/OperatorTerminal.tsx')
          text = path.read_text()
          anchor = '            <div className={`p-3 rounded-2xl shadow-md ${activeCallTheme.icon}`}>\n              <Flame className="w-7 h-7" />\n            </div>'
          replacement = '            <div className={`p-3 rounded-2xl shadow-md ${activeCallTheme.icon}`}>\n              {activeCallPrimaryCategory === "leader_call" ? (\n                <UserCheck className="w-7 h-7" />\n              ) : activeCallPrimaryCategory === "material_support" ? (\n                <Boxes className="w-7 h-7" />\n              ) : (\n                <Flame className="w-7 h-7" />\n              )}\n            </div>'
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'Expected exactly one active-call icon block, found {count}; refusing to modify anything.')
          path.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Verify only intended UI mapping
        run: |
          grep -q 'activeCallPrimaryCategory === "leader_call"' src/components/OperatorTerminal.tsx
          grep -q '<UserCheck className="w-7 h-7" />' src/components/OperatorTerminal.tsx
          grep -q '<Boxes className="w-7 h-7" />' src/components/OperatorTerminal.tsx
          git diff --check

      - name: Commit UI-only change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/OperatorTerminal.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ui): match active Andon notification icon to call type'
          git push origin main
