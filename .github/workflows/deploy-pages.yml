name: Deploy Smart Andon to GitHub Pages

# Republish marker: 2026-09-07 clean Pages reset
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site for GitHub Pages
        run: npx vite build --emptyOutDir
        env:
          GITHUB_PAGES: 'true'
          VITE_DATA_PROVIDER: demo

      - name: Verify Pages build
        run: |
          test -f dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'ERROR: dist/index.html still references Vite source entry.'
            exit 1
          fi
          grep -q '/smart-andon-manufacturing-system/assets/' dist/index.html
          echo 'Verified: deploy artifact contains compiled GitHub Pages assets.'

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
