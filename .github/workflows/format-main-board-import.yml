name: One-time MainAndonBoard import cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Format lucide import only
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/MainAndonBoard.tsx')
          text = path.read_text()
          old = '''import { 
  AlertOctagon, 
  CheckCircle2, 
  Clock, 
  Flame, 
  AlertTriangle, 
  
  TrendingUp, 
  Activity, 
  Zap,
    Boxes,
            } from "lucide-react";'''
          new = '''import {
  AlertOctagon,
  CheckCircle2,
  Clock,
  Flame,
  AlertTriangle,
  TrendingUp,
  Activity,
  Zap,
  Boxes,
} from "lucide-react";'''
          if old not in text:
              raise SystemExit('Expected lucide import block not found; refusing to modify source.')
          path.write_text(text.replace(old, new, 1))

      - name: Verify navigation preserved
        run: |
          grep -q 'onNavigateToCall: (lineId: string) => void;' src/components/MainAndonBoard.tsx
          grep -q 'onClick={() => onNavigateToCall(line.id)}' src/components/MainAndonBoard.tsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/format-main-board-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MainAndonBoard.tsx .github/workflows/format-main-board-import.yml
          git commit -m "chore: clean MainAndonBoard import formatting"
          git push origin main
