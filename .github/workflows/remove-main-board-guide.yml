name: Remove Main Board Guide
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-main-board-guide.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove redundant guide block and unused guide code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MainAndonBoard.tsx')
          s = p.read_text()
          start = s.index('      {/* Interactive Workflow Guide for New Users */}')
          end = s.index('      {/* Top KPI Cards (Andon KPI Header) */}')
          s = s[:start] + s[end:]
          s = s.replace('import React, { useState, useEffect } from "react";', 'import React, { useState, useEffect } from "react";')
          for name in ['ArrowRight, ', 'HelpCircle,\n', 'ChevronUp,\n', 'ChevronDown,\n', 'PhoneCall,\n', 'Tv,\n', 'Wrench,\n', 'Database\n']:
              s = s.replace(name, '')
          s = s.replace('  const [showGuide, setShowGuide] = useState<boolean>(() => {\n    return safeLocalStorageGet("andon_show_guide") !== "false";\n  });\n\n', '')
          toggle = '''  const toggleGuide = () => {\n    const nextState = !showGuide;\n    setShowGuide(nextState);\n    safeLocalStorageSet("andon_show_guide", String(nextState));\n  };\n\n'''
          s = s.replace(toggle, '')
          s = s.replace('import { safeLocalStorageSet, safeLocalStorageGet } from "../utils/sanitizer";\n', '')
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MainAndonBoard.tsx
          git diff --cached --quiet || git commit -m "style: remove redundant dashboard guide"
          git push